- name: Verificar credencial Firebase
  working-directory: private-code
  env:
    FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  run: |
    echo "Tamanho do secret: ${#FIREBASE_SERVICE_ACCOUNT}"
    if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
      echo "ERRO: FIREBASE_SERVICE_ACCOUNT está vazio!"
      exit 1
    fi

    printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebasekey.json

    echo "Tamanho do arquivo: $(wc -c < firebasekey.json) bytes"

    python -c "import json; json.load(open('firebasekey.json')); print('JSON do Firebase válido')"
