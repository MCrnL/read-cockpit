name: Sync FusionSolar -> Firestore
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "sync grava no Firestore; dry-run só simula"
        type: choice
        options:
          - sync
          - dry-run
        default: sync

concurrency:
  group: sync-fusionsolar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      # Baixa o código do repositório privado
      - name: Baixar código privado
        uses: actions/checkout@v4
        with:
          repository: MCrnL/cockpit-monitor
          token: ${{ secrets.REPO_PAT }}
          path: private-code

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        working-directory: private-code
        run: pip install -r requirements.txt

      - name: Criar credencial do Firebase
        working-directory: private-code
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebasekey.json

      - name: Verificar credencial Firebase
        working-directory: private-code
        run: |
          echo "Tamanho do arquivo: $(wc -c < firebasekey.json) bytes"
          python -c "import json; json.load(open('firebasekey.json')); print('JSON do Firebase válido')"

      # fusionsolar_map.json e cockpit_sync.py vêm do repo privado (private-code)
      - name: Rodar sincronização FusionSolar
        working-directory: private-code
        env:
          FUSIONSOLAR_USER: ${{ secrets.FUSIONSOLAR_USER }}
          FUSIONSOLAR_PASS: ${{ secrets.FUSIONSOLAR_PASS }}
          FIREBASE_CREDENTIALS_PATH: firebasekey.json
          MODO: ${{ github.event.inputs.modo || 'sync' }}
        run: |
          if [ "$MODO" = "dry-run" ]; then
            python fusionsolar.py --dry-run
          else
            python fusionsolar.py
          fi

      - name: Remover credencial
        if: always()
        working-directory: private-code
        run: rm -f firebasekey.json
