name: Sync ShineMonitor -> Firestore
on:
  workflow_dispatch: {}

concurrency:
  group: sync-shinemonitor
  cancel-in-progress: false

jobs:
  sync:
   runs-on: ubuntu-24.04
    steps:
      # Baixa o código do repositório privado
      - name: Baixar código privado
        uses: actions/checkout@v4
        with:
          # Confirme se o script está neste mesmo repositório ou altere se necessário
          repository: MCrnL/cockpit-monitor 
          token: ${{ secrets.REPO_PAT }}
          path: private-code

      # Configura Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Instala as dependências
      - name: Instalar dependências
        working-directory: private-code
        run: pip install -r requirements.txt

      # Cria o firebasekey.json usando o Secret
      - name: Criar credencial do Firebase
        working-directory: private-code
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > firebasekey.json

      # Valida se o Secret foi recebido e se o JSON é válido
      - name: Verificar credencial Firebase
        working-directory: private-code
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
        run: |
          echo "Tamanho do secret: ${#FIREBASE_SERVICE_ACCOUNT}"
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "ERRO: FIREBASE_CREDENTIALS_JSON está vazio!"
            exit 1
          fi
          echo "Tamanho do arquivo: $(wc -c < firebasekey.json) bytes"
          python -c "import json; json.load(open('firebasekey.json')); print('JSON do Firebase válido')"

      # Executa a sincronização do ShineMonitor
      - name: Rodar sincronização ShineMonitor
        working-directory: private-code
        env:
          # Variáveis atualizadas para o ShineMonitor (ajuste caso seu script exija nomes diferentes)
          SHINEMONITOR_USER: ${{ secrets.SHINEMONITOR_USER }}
          SHINEMONITOR_PASS: ${{ secrets.SHINEMONITOR_PASS }}
        run: python shinemonitor_sync.py

      # Remove a credencial ao final
      - name: Remover credencial
        if: always()
        working-directory: private-code
        run: rm -f firebasekey.json
